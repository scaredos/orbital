<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#ddd;--acc:#2856d8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#999;--line:#2a2d35;--acc:#7aa2ff}}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px}h2{font-size:16px;margin-top:28px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
button{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
code,pre{background:rgba(127,127,127,.12);padding:2px 4px;border-radius:3px;white-space:pre-wrap;word-break:break-all}
.mut{color:var(--mut)}
</style>
</head>
<body>
<!-- Placeholder portal. The full portal (web/) will replace this. -->
<h1>Orbital <span class="mut" id="me"></span></h1>
<p id="login" hidden><a href="/v1/auth/login">Sign in with SSO</a></p>
<div id="app" hidden>
  <h2>Nodes <button onclick="addNode()">Add node</button></h2>
  <pre id="join" hidden></pre>
  <table id="nodes"></table>
  <h2>Approvals</h2><table id="approvals"></table>
  <h2>Sessions</h2><table id="sessions"></table>
  <h2>Audit</h2><table id="audit"></table>
</div>
<script>
const api = (p, o = {}) => fetch(p, {...o, headers: {'x-orbital-csrf': '1', 'content-type': 'application/json'}})
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const table = (id, head, rows) => document.getElementById(id).innerHTML =
  '<tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
async function addNode() {
  try { const j = await api('/v1/nodes/join', {method: 'POST'}); const el = document.getElementById('join'); el.hidden = false; el.textContent = j.command; }
  catch (e) { alert(e.message); }
}
async function decide(id, action) { try { await api(`/v1/grants/${id}/${action}`, {method: 'POST'}); load(); } catch (e) { alert(e.message); } }
async function kill(id) { try { await api(`/v1/sessions/${id}/kill`, {method: 'POST'}); load(); } catch (e) { alert(e.message); } }
async function load() {
  let me; try { me = await api('/v1/me'); } catch { document.getElementById('login').hidden = false; return; }
  document.getElementById('me').textContent = '— ' + me.username;
  document.getElementById('app').hidden = false;
  const nodes = await api('/v1/nodes');
  table('nodes', ['Name', 'Labels', 'Services', 'Status', 'Last seen'], nodes.map(n => [esc(n.name),
    esc(Object.entries(n.labels).map(([k, v]) => k + '=' + v).join(', ')), esc(Object.keys(n.services).join(', ')),
    n.online ? 'online' : (n.stale ? 'stale' : 'offline'), esc(n.last_seen)]));
  const ap = await api('/v1/approvals').catch(() => []);
  table('approvals', ['User', 'Target', 'Reason', ''], ap.map(a => [esc(a.user), esc(a.login + '@' + a.node), esc(a.reason),
    `<button onclick="decide('${a.id}','approve')">Approve</button> <button onclick="decide('${a.id}','deny')">Deny</button>`]));
  const ss = await api('/v1/sessions').catch(() => []);
  table('sessions', ['Started', 'User', 'Target', 'Ended', ''], ss.slice(0, 30).map(s => [esc(s.started_at), esc(s.username) + (s.emergency ? ' 🚨' : ''),
    esc(s.login + '@' + s.node_name), esc(s.end_reason || 'live'), s.ended_at ? '' : `<button onclick="kill('${s.id}')">Kill</button>`]));
  const au = await api('/v1/audit?limit=50').catch(() => []);
  table('audit', ['At', 'Kind', 'Actor', 'Data'], au.map(a => [esc(a.at), esc(a.kind), esc(a.actor), `<code>${esc(JSON.stringify(a.data))}</code>`]));
}
load();
</script>
</body>
</html>
