[package]
name = "orbital-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orbital-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
russh.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["mime-guess"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
hyper = "1"
hyper-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
aes-gcm = "0.10"
hmac = "0.12"
x509-parser = "0.16"
time = "0.3"
